<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bộ Sưu Tập Micro-interaction Buttons</title>
    
    <!-- Link tới thư viện FontAwesome cho các icon -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Link tới file CSS bên ngoài -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- 1. Nút Nảy bật (Elastic) -->
        <button class="btn-elastic">Gửi tin nhắn</button>
        
        <!-- 2. Nút Neon Phát sáng -->
        <button class="btn-neon">Khởi động</button>

        <!-- 3. Nút Đổ đầy mực (Liquid Fill) -->
        <button class="btn-fill">Đăng ký ngay</button>

        <!-- 4. Nút Vật lý 3D -->
        <button class="btn-3d">Nạp tiền</button>

        <!-- 5. Nút Trượt Icon (Kèm FontAwesome icon) -->
        <button class="btn-slide">
            <span class="text">Xem chi tiết</span>
            <i class="fas fa-arrow-right icon"></i>
        </button>

        <!-- 6. Nút Nhịp đập (Pulse) - Pink/White -->
        <button class="btn-pulse">Yêu thích</button>

        <!-- 7. Nút Quét màu (Sweep Up) - Pink/White -->
        <button class="btn-sweep">Khám phá</button>

        <!-- 8. Nút Thạch mềm (Jelly Wobble) - Pink/White -->
        <button class="btn-jelly">Quà tặng</button>
    </div>

    <!-- Script tạo hiệu ứng bất ngờ khi click -->
    <script src="script.js"></script>
</body>
</html>
